# Applied after the app's prj.conf, so these win.
CONFIG_ZTEST=y

# Kernel asserts on: a mutex taken in a k_timer expiry (or any other ISR)
# stops the test with "ASSERTION FAIL ... mutexes cannot be used inside
# ISRs" instead of misbehaving quietly.
CONFIG_ASSERT=y

CONFIG_SENSOR=y

# The tests drive the shell through the dummy backend, not a UART.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_SERIAL=n

# Log lines go straight to stdout instead of into the shell output the
# tests read.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
